<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실습 교안 — 강사용 모아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --main:#3182F6;
  --main-dark:#1B64DA;
  --bg:#F2F4F6;
  --card:#FFFFFF;
  --border:#E5E8EB;
  --title:#191F28;
  --body1:#333D4B;
  --body2:#4E5968;
  --sub:#6B7684;
  --ph:#8B95A1;
  --needle:#2E6E5E;
  --needle-soft:#E2EEE9;
  --danger:#D8452B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:var(--bg);color:var(--title);line-height:1.6;
}
.wrap{max-width:1100px;margin:0 auto;padding:36px 20px 80px}
header{margin-bottom:24px}
.eyebrow{font-size:13px;font-weight:600;color:var(--main);margin-bottom:6px}
h1{font-size:26px;font-weight:700;color:var(--title)}
.sub{color:var(--sub);font-size:14px;margin-top:6px}

.codecard{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:28px 26px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;
}
.codecard .left{display:flex;flex-direction:column;gap:6px}
.codecard .code-label{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.06em}
.codecard .code-value{font-size:40px;font-weight:800;letter-spacing:.08em;color:var(--main)}
.codecard .code-value.empty{color:var(--ph);font-size:20px;font-weight:600}
.codecard .right{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  cursor:pointer;font-weight:700;font-size:14px;border:none;border-radius:999px;padding:11px 20px;transition:.15s;
}
.btn.primary{background:var(--main);color:#fff}
.btn.primary:hover{background:var(--main-dark)}
.btn.ghost{background:#fff;border:1.5px solid var(--border);color:var(--body1)}
.btn.ghost:hover{border-color:var(--main);color:var(--main)}
.btn.danger{background:#fff;border:1.5px solid var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.danger.armed{background:var(--danger);color:#fff}

.lookup-row{display:flex;gap:8px;align-items:center}
.lookup-row input{
  font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;width:130px;
}
.lookup-row input:focus-visible{outline:3px solid var(--main);outline-offset:1px}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .count{font-size:14px;color:var(--body2);font-weight:600}
.toolbar .actions{display:flex;gap:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;cursor:pointer;transition:.15s;
}
.card:hover{border-color:var(--main);box-shadow:0 2px 10px rgba(49,130,246,.10)}
.card .brand{font-size:16px;font-weight:700;color:var(--title);margin-bottom:4px}
.card .time{font-size:12px;color:var(--ph);margin-bottom:10px}
.card .preview{font-size:13.5px;color:var(--body2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.empty-state{
  background:var(--card);border:1px dashed var(--border);border-radius:14px;
  padding:48px 20px;text-align:center;color:var(--sub);font-size:14px;
}

.overlay{position:fixed;inset:0;background:rgba(25,31,40,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:400}
.overlay.on{display:flex}
.modal{
  background:var(--card);border-radius:16px;max-width:620px;width:100%;max-height:86vh;overflow:auto;
  padding:32px 28px;position:relative;
}
.modal .close{position:absolute;top:14px;right:14px;border:none;background:none;font-size:20px;color:var(--ph);cursor:pointer}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .meta{font-size:12.5px;color:var(--sub);margin-bottom:18px}
.slot{border-bottom:1px solid var(--border);padding:12px 0}
.slot:last-child{border-bottom:none}
.slot .lbl{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:4px}
.slot .val{font-size:14.5px;color:var(--body1);white-space:pre-line}
.slot .val.empty{color:var(--ph)}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--title);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:500;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">EZlook 강의 도구</div>
    <h1>실습 교안 — 강사용 모아보기</h1>
    <p class="sub">수업 코드를 공유해 학생들의 미니 사업계획서를 프로젝터로 함께 확인해요.</p>
  </header>

  <div class="codecard">
    <div class="left">
      <span class="code-label">현재 보고 있는 수업 코드</span>
      <span class="code-value empty" id="codeValue">수업 코드를 만들거나 입력해주세요</span>
    </div>
    <div class="right">
      <div class="lookup-row">
        <input type="text" id="lookupInput" maxlength="8" placeholder="코드 입력">
        <button class="btn ghost" id="lookupBtn" type="button">보기</button>
      </div>
      <button class="btn primary" id="newClassBtn" type="button">새 수업 시작</button>
    </div>
  </div>

  <div class="toolbar">
    <span class="count" id="countLabel">학생이 업로드하면 이 화면에 나타나요</span>
    <div class="actions">
      <button class="btn ghost" id="refreshBtn" type="button">↻ 새로고침</button>
      <button class="btn danger" id="resetBtn" type="button">수업 전체 초기화</button>
    </div>
  </div>

  <div id="gridHolder"><div class="empty-state">수업 코드를 먼저 만들거나 입력해주세요</div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="modalClose" type="button">✕</button>
    <h2 id="modalBrand">브랜드명</h2>
    <div class="meta" id="modalMeta"></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLAN_SLOTS = [
  {label:"아이템 (한 문장)", keys:["p2_s3"]},
  {label:"비즈니스 모델", keys:["p1_s1"]},
  {label:"주요 경쟁력", keys:["p1_s2"]},
  {label:"차별화", keys:["p4_s3","p1_s3"], pickFirst:true},
  {label:"홍보 방안 (숫자)", keys:["p3_s2","p3_s3"], join:true},
  {label:"기대 효과", keys:["p6_s3"]},
  {label:"ESG 한 줄", keys:["p5_s3"]},
  {label:"향후 계획 · 인력 구성", keys:["p7_future","p7_team"], join:true},
];

function slotValue(slot, answers){
  if (slot.join) return slot.keys.map(k=>(answers[k]||'').trim()).filter(Boolean).join('\n');
  if (slot.pickFirst){ for (const k of slot.keys){ if ((answers[k]||'').trim()) return answers[k].trim(); } return ''; }
  return (answers[slot.keys[0]]||'').trim();
}
function previewText(answers){
  return PLAN_SLOTS.map(s=>slotValue(s,answers)).filter(Boolean).join(' · ') || '(아직 작성된 내용이 없어요)';
}

let currentCode = '';
let currentSubmissions = [];
let refreshTimer = null;

const codeValueEl = document.getElementById('codeValue');
const lookupInput = document.getElementById('lookupInput');
const gridHolder = document.getElementById('gridHolder');
const countLabel = document.getElementById('countLabel');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 2200);
}

function setCurrentCode(code){
  currentCode = code;
  try{ localStorage.setItem('gsap_v2_admin_lastcode', code); }catch{}
  if (code){ codeValueEl.textContent = code; codeValueEl.classList.remove('empty'); }
  else { codeValueEl.textContent = '수업 코드를 만들거나 입력해주세요'; codeValueEl.classList.add('empty'); }
  if (refreshTimer) clearInterval(refreshTimer);
  if (code){
    loadSubmissions();
    refreshTimer = setInterval(loadSubmissions, 15000);
  }
}

document.getElementById('newClassBtn').onclick = async ()=>{
  try{
    const res = await fetch('/api/study/class/new', { method:'POST' });
    const data = await res.json();
    if (data && data.success){ lookupInput.value = data.code; setCurrentCode(data.code); showToast('새 수업을 시작했어요'); }
    else showToast('수업을 시작하지 못했어요');
  }catch{ showToast('네트워크 문제가 있어요'); }
};

document.getElementById('lookupBtn').onclick = ()=>{
  const code = lookupInput.value.toUpperCase().trim();
  if (!code){ showToast('수업 코드를 입력해주세요'); return; }
  lookupInput.value = code;
  setCurrentCode(code);
};
lookupInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter') document.getElementById('lookupBtn').click(); });

document.getElementById('refreshBtn').onclick = ()=> loadSubmissions();

async function loadSubmissions(){
  if (!currentCode) return;
  try{
    const res = await fetch('/api/study/submissions?class='+encodeURIComponent(currentCode));
    const data = await res.json();
    if (!data || !data.success){
      gridHolder.innerHTML = `<div class="empty-state">${(data && data.message) || '조회하지 못했어요'}</div>`;
      countLabel.textContent = '조회 실패';
      return;
    }
    currentSubmissions = data.submissions || [];
    countLabel.textContent = `제출 ${currentSubmissions.length}건`;
    if (!currentSubmissions.length){
      gridHolder.innerHTML = '<div class="empty-state">아직 업로드한 학생이 없어요</div>';
      return;
    }
    gridHolder.innerHTML = '<div class="grid" id="grid"></div>';
    const gridEl = document.getElementById('grid');
    currentSubmissions.forEach((s)=>{
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="brand">${(s.brandAlias||'(이름 없음)').replace(/</g,'&lt;')}</div>
        <div class="time">${s.updatedAt||''}</div>
        <div class="preview">${previewText(s.answers||{}).replace(/</g,'&lt;')}</div>`;
      el.onclick = ()=> openModal(s);
      gridEl.appendChild(el);
    });
  }catch{
    gridHolder.innerHTML = '<div class="empty-state">네트워크 문제로 불러오지 못했어요</div>';
  }
}

const overlay = document.getElementById('overlay');
function openModal(s){
  document.getElementById('modalBrand').textContent = s.brandAlias || '(이름 없음)';
  document.getElementById('modalMeta').textContent = '업데이트: '+(s.updatedAt||'');
  document.getElementById('modalBody').innerHTML = PLAN_SLOTS.map(slot=>{
    const val = slotValue(slot, s.answers||{});
    return `<div class="slot"><div class="lbl">${slot.label}</div><div class="val${val?'':' empty'}">${val? val.replace(/</g,'&lt;') : '(미작성)'}</div></div>`;
  }).join('');
  overlay.classList.add('on');
}
document.getElementById('modalClose').onclick = ()=> overlay.classList.remove('on');
overlay.addEventListener('click', (e)=>{ if (e.target===overlay) overlay.classList.remove('on'); });

let resetArmed = false;
document.getElementById('resetBtn').onclick = async ()=>{
  if (!currentCode){ showToast('수업 코드를 먼저 선택해주세요'); return; }
  const btn = document.getElementById('resetBtn');
  if (!resetArmed){
    resetArmed = true; btn.classList.add('armed'); btn.textContent = '정말 전체 삭제할까요? 한 번 더 눌러주세요';
    setTimeout(()=>{ resetArmed=false; btn.classList.remove('armed'); btn.textContent='수업 전체 초기화'; }, 3000);
    return;
  }
  resetArmed = false; btn.classList.remove('armed'); btn.textContent='수업 전체 초기화';
  try{
    const res = await fetch('/api/study/class/'+encodeURIComponent(currentCode)+'/reset', { method:'POST' });
    const data = await res.json();
    if (data && data.success){ showToast('수업 데이터를 모두 삭제했어요'); loadSubmissions(); }
    else showToast('삭제하지 못했어요');
  }catch{ showToast('네트워크 문제가 있어요'); }
};

(function init(){
  const qs = new URLSearchParams(location.search);
  let code = (qs.get('class')||'').toUpperCase().trim();
  if (!code){ try{ code = localStorage.getItem('gsap_v2_admin_lastcode') || ''; }catch{} }
  if (code){ lookupInput.value = code; setCurrentCode(code); }
})();
</script>
</body>
</html>
